<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:" />
    <title>Hamster Desk</title>
    <!--
      The loading screen. Plain markup and inline CSS, so it paints with the document — before the
      bundle below has been fetched, let alone run. App.tsx takes it down once the settings and the
      saved tabs are in (`booting`). Only transform/opacity are animated: those run on the
      compositor and keep moving while the main thread is busy starting the app.
      Colours are `--bg` / `--accent` of styles.css, by the OS palette until <html data-theme> says.
    -->
    <style>
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #f4f6f4; color: #b04f2c; transition: opacity 0.22s ease; }
      #splash[data-done] { opacity: 0; pointer-events: none; }
      #splash img { width: 96px; height: 96px; image-rendering: pixelated; animation: splash-bob 0.7s ease-in-out infinite alternate; }
      #splash p { display: flex; gap: 8px; margin: 0; }
      #splash i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.2; animation: splash-dot 1.2s ease-in-out infinite; }
      #splash i:nth-child(2) { animation-delay: 0.2s; }
      #splash i:nth-child(3) { animation-delay: 0.4s; }
      @keyframes splash-bob { to { transform: translateY(-8px); } }
      @keyframes splash-dot { 40% { opacity: 1; } 80%, 100% { opacity: 0.2; } }
      @media (prefers-color-scheme: dark) { #splash { background: #0f1311; color: #e0855f; } }
      :root[data-theme='light'] #splash { background: #f4f6f4; color: #b04f2c; }
      :root[data-theme='dark'] #splash { background: #0f1311; color: #e0855f; }
      @media (prefers-reduced-motion: reduce) { #splash img, #splash i { animation: none; } #splash i { opacity: 0.6; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <img src="./assets/hamster.png" alt="" />
      <p><i></i><i></i><i></i></p>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
